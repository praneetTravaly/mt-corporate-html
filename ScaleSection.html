<section id="scale" class="scale-section-v2">
  <div class="scale-bg-hazard">
    <svg
      class="scale-globe"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
      <path d="M2 12h20"></path>
    </svg>
    <div class="scale-bg-pattern"></div>
  </div>

  <div class="container scale-container relative z-10">
    <div class="scale-header">
      <span class="micro-label block mb-4">Scale & Market Position</span>
      <h2 class="scale-title tracking-tight mb-8">Built for Global Scale</h2>
      <p class="scale-desc font-light max-w-xl">
        Technology that performs. Infrastructure that scales. Powering travel
        across every continent.
      </p>
    </div>

    <div class="scale-grid pt-16">
      <div class="stat-group2 group">
        <div class="stat-value origin-left">190+</div>
        <div class="micro-label stat-label leading-tight">Active Markets</div>
        <div class="stat-underline"></div>
      </div>
      <div class="stat-group2 group">
        <div class="stat-value origin-left">10,000+</div>
        <div class="micro-label stat-label leading-tight">Partner Hotels</div>
        <div class="stat-underline"></div>
      </div>
      <div class="stat-group2 group">
        <div class="stat-value origin-left">1M+</div>
        <div class="micro-label stat-label leading-tight">Global Travelers</div>
        <div class="stat-underline"></div>
      </div>
      <div class="stat-group2 group">
        <div class="stat-value origin-left">5,000+</div>
        <div class="micro-label stat-label leading-tight">
          Creator & Agent Network
        </div>
        <div class="stat-underline"></div>
      </div>
      <div class="stat-group2 group">
        <div class="stat-value origin-left">$30K+</div>
        <div class="micro-label stat-label leading-tight">
          Gross Booking Value
        </div>
        <div class="stat-underline"></div>
      </div>
      <div class="stat-group2 group">
        <div class="stat-value origin-left">99.99%</div>
        <div class="micro-label stat-label leading-tight">
          Technology Uptime
        </div>
        <div class="stat-underline"></div>
      </div>
    </div>
  </div>
</section>
