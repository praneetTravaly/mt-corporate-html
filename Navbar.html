<nav id="navbar" class="nav-transparent">
  <div class="nav-container-inner">
    <div class="nav-logo-group">
      <img src="https://dwq3yv87q1b43.cloudfront.net/public/static/logo/logov1.png" alt="MyTravaly Logo">
      <span class="nav-brand-text">MyTravaly</span>
    </div>

    <!-- Desktop Nav -->
    <div class="desktop-nav-links">
      <a href="#platform">Platform</a>
      <a href="#scale">Scale</a>
      <a href="#partners">Partners</a>
      <a href="#governance">Governance</a>
      <a href="#team">Team</a>
      <a href="#insights">Insights</a>
      <a href="#connect">Connect</a>
    </div>

    <!-- Mobile Toggle -->
    <button id="mobile-toggle" class="mobile-toggle-btn">
      <svg id="icon-menu" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" x2="20" y1="12" y2="12"></line>
        <line x1="4" x2="20" y1="6" y2="6"></line>
        <line x1="4" x2="20" y1="18" y2="18"></line>
      </svg>
      <svg id="icon-close" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" x2="6" y1="6" y2="18"></line>
        <line x1="6" x2="18" y1="6" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="mobile-menu mobile-menu-hidden">
    <a href="#platform">Platform</a>
    <a href="#scale">Scale</a>
    <a href="#partners">Partners</a>
    <a href="#governance">Governance</a>
    <a href="#team">Team</a>
    <a href="#insights">Insights</a>
    <a href="#connect">Connect</a>
  </div>
</nav>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const navbar = document.getElementById("navbar");
    const mobileToggle = document.getElementById("mobile-toggle");
    const mobileMenu = document.getElementById("mobile-menu");
    const iconMenu = document.getElementById("icon-menu");
    const iconClose = document.getElementById("icon-close");
    const mobileLinks = mobileMenu.querySelectorAll("a");

    const handleScroll = () => {
      if (window.scrollY > 20) {
        navbar.classList.remove("nav-transparent");
        navbar.classList.add("nav-scrolled");
      } else {
        navbar.classList.remove("nav-scrolled");
        navbar.classList.add("nav-transparent");
      }
    };

    window.addEventListener("scroll", handleScroll);
    handleScroll(); // init

    const toggleMenu = () => {
      const isHidden = mobileMenu.classList.contains("mobile-menu-hidden");
      if (isHidden) {
        mobileMenu.classList.remove("mobile-menu-hidden");
        mobileMenu.classList.add("mobile-menu-visible");
        iconMenu.classList.add("hidden");
        iconClose.classList.remove("hidden");
      } else {
        mobileMenu.classList.remove("mobile-menu-visible");
        mobileMenu.classList.add("mobile-menu-hidden");
        iconMenu.classList.remove("hidden");
        iconClose.classList.add("hidden");
      }
    };

    mobileToggle.addEventListener("click", toggleMenu);

    mobileLinks.forEach(link => {
      link.addEventListener("click", () => {
        mobileMenu.classList.remove("mobile-menu-visible");
        mobileMenu.classList.add("mobile-menu-hidden");
        iconMenu.classList.remove("hidden");
        iconClose.classList.add("hidden");
      });
    });
  });
</script>
